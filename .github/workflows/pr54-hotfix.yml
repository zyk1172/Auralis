# SPDX-License-Identifier: GPL-3.0-only
name: PR54 hotfix

on:
  pull_request:
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/local-music-playback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-music-playback
          fetch-depth: 0
      - name: Patch SettingsRootPage signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/feature/settings/src/main/java/com/auralis/feature/settings/SettingsScreens.kt')
          text = path.read_text()
          old = '''    onEditHomeLayout: () -> Unit,\n    onOpenAiSettings: () -> Unit,\n    recommendationIndexState: RecommendationIndexUiState,'''
          new = '''    onEditHomeLayout: () -> Unit,\n    onOpenAiSettings: () -> Unit,\n    onOpenLocalMusic: () -> Unit,\n    recommendationIndexState: RecommendationIndexUiState,'''
          if old not in text:
              raise SystemExit('expected SettingsRootPage signature not found')
          # Only patch the private root signature; the public SettingsScreen signature already contains this parameter.
          first = text.find(old)
          second = text.find(old, first + 1)
          if second == -1:
              # The first occurrence is the private signature in this branch after the public signature diverged.
              target = first
          else:
              target = second
          text = text[:target] + text[target:].replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit hotfix and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr54-hotfix.yml
          git add android/feature/settings/src/main/java/com/auralis/feature/settings/SettingsScreens.kt
          git commit -m "fix(android): wire local music settings callback"
          git push origin HEAD:feat/local-music-playback
