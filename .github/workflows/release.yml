# SPDX-License-Identifier: GPL-3.0-only
name: Auralis Test Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有的版本 tag，例如 v1.2.0"
        required: true
        type: string

concurrency:
  group: auralis-test-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_name: ${{ steps.release.outputs.version_name }}
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tags must use stable semver, for example v1.2.0; got ${tag}" >&2
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
            echo "::error::The release tag does not exist in this checkout: ${tag}" >&2
            exit 1
          fi

          version_name="${BASH_REMATCH[1]}"
          {
            echo "tag=${tag}"
            echo "version_name=${version_name}"
            echo "version_code=${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

  android:
    name: Android debug APKs
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: auralis-android-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and install build tools
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager}" ]]; then
            sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          fi
          yes | "${sdkmanager}" --licenses >/dev/null 2>&1 || true
          "${sdkmanager}" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Run Android tests and build installable debug APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 \
            testDebugUnitTest \
            :app-mobile:assembleDebug \
            :app-tv:assembleDebug \
            -PauralisVersionName="${VERSION_NAME}" \
            -PauralisVersionCode="${VERSION_CODE}" \
            --stacktrace

      - name: Verify and stage Android APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          [[ -x "${apksigner}" ]] || { echo "::error::apksigner was not found" >&2; exit 1; }

          mobile_apk="$(find app-mobile/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          tv_apk="$(find app-tv/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          for apk in "${mobile_apk}" "${tv_apk}"; do
            [[ -s "${apk}" ]] || { echo "::error::APK was not produced: ${apk}" >&2; exit 1; }
            "${apksigner}" verify --verbose "${apk}"
          done

          output_dir="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "${output_dir}"
          cp "${mobile_apk}" "${output_dir}/Auralis-${RELEASE_TAG}-Android-Mobile-debug.apk"
          cp "${tv_apk}" "${output_dir}/Auralis-${RELEASE_TAG}-Android-TV-debug.apk"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Unsigned macOS DMG
    needs: metadata
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Verify XcodeGen project consistency
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}.zip"
          install_dir="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${archive}"
          printf '%s  %s\n' "${XCODEGEN_SHA256}" "${archive}" | shasum -a 256 --check
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          "${install_dir}/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- Auralis.xcodeproj/project.pbxproj

      - name: Run Swift package tests
        run: swift test --jobs 1 --package-path Packages/AuralisCore

      - name: Archive unsigned macOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme AuralisMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${RUNNER_TEMP}/Auralis-macOS.xcarchive" \
            -derivedDataPath "${RUNNER_TEMP}/Auralis-macOS-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${VERSION_NAME}" \
            CURRENT_PROJECT_VERSION="${VERSION_CODE}" \
            archive

      - name: Create and stage unsigned macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          app_path="${RUNNER_TEMP}/Auralis-macOS.xcarchive/Products/Applications/Auralis.app"
          [[ -d "${app_path}" ]] || { echo "::error::macOS archive did not contain Auralis.app" >&2; exit 1; }

          staging_dir="${RUNNER_TEMP}/Auralis-dmg-staging"
          mkdir -p "${staging_dir}"
          ditto "${app_path}" "${staging_dir}/Auralis.app"
          ln -s /Applications "${staging_dir}/Applications"

          dmg_path="${RUNNER_TEMP}/Auralis-${RELEASE_TAG}-macOS-unsigned.dmg"
          hdiutil create \
            -volname "Auralis ${VERSION_NAME}" \
            -srcfolder "${staging_dir}" \
            -ov \
            -format UDZO \
            "${dmg_path}"
          hdiutil imageinfo "${dmg_path}" >/dev/null

          mkdir -p release-assets
          cp "${dmg_path}" "release-assets/Auralis-${RELEASE_TAG}-macOS-unsigned.dmg"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub test release
    needs: [metadata, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          (( ${#assets[@]} > 0 )) || { echo "::error::No release assets were downloaded" >&2; exit 1; }
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --prerelease \
              --title "Auralis ${RELEASE_TAG#v} (test packages)" \
              --notes "Unsigned macOS DMG and debug-signed Android APKs for early testing. iOS/iPadOS is not included until Apple signing is available."
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
