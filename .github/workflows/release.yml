# SPDX-License-Identifier: GPL-3.0-only
name: Auralis Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有的稳定版本 tag，例如 v1.2.0"
        required: true
        type: string
      ios_export_method:
        description: "iOS IPA 导出方式"
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store

concurrency:
  group: auralis-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_name: ${{ steps.release.outputs.version_name }}
      version_code: ${{ steps.release.outputs.version_code }}
      ios_export_method: ${{ steps.release.outputs.ios_export_method }}
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_IOS_EXPORT_METHOD: ${{ inputs.ios_export_method }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ios_export_method="${INPUT_IOS_EXPORT_METHOD}"
          else
            ios_export_method="ad-hoc"
          fi
          if [[ "${ios_export_method}" != "ad-hoc" && "${ios_export_method}" != "app-store" ]]; then
            echo "::error::Unsupported iOS export method: ${ios_export_method}" >&2
            exit 1
          fi

          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tags must use stable semver, for example v1.2.0; got ${tag}" >&2
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
            echo "::error::The release tag does not exist in this checkout: ${tag}" >&2
            exit 1
          fi

          version_name="${BASH_REMATCH[1]}"
          {
            echo "tag=${tag}"
            echo "version_name=${version_name}"
            echo "version_code=${GITHUB_RUN_NUMBER}"
            echo "ios_export_method=${ios_export_method}"
          } >> "${GITHUB_OUTPUT}"

  android:
    name: Android signed APKs
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and install build tools
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager}" ]]; then
            sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          fi
          yes | "${sdkmanager}" --licenses >/dev/null 2>&1 || true
          "${sdkmanager}" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Prepare Android release keystore
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}" >&2
              exit 1
            fi
          done

          keystore_path="${RUNNER_TEMP}/auralis-release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          test -s "${keystore_path}"
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Run Android tests and build signed release APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 \
            testDebugUnitTest \
            :app-mobile:assembleRelease \
            :app-tv:assembleRelease \
            -PauralisVersionName="${VERSION_NAME}" \
            -PauralisVersionCode="${VERSION_CODE}" \
            --stacktrace

      - name: Verify and stage Android APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          [[ -x "${apksigner}" ]] || { echo "::error::apksigner was not found" >&2; exit 1; }

          output_dir="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "${output_dir}"
          mobile_apk="app-mobile/build/outputs/apk/release/app-mobile-release.apk"
          tv_apk="app-tv/build/outputs/apk/release/app-tv-release.apk"
          for apk in "${mobile_apk}" "${tv_apk}"; do
            [[ -s "${apk}" ]] || { echo "::error::APK was not produced: ${apk}" >&2; exit 1; }
            "${apksigner}" verify --verbose "${apk}"
          done

          cp "${mobile_apk}" "${output_dir}/Auralis-${RELEASE_TAG}-Android-Mobile.apk"
          cp "${tv_apk}" "${output_dir}/Auralis-${RELEASE_TAG}-Android-TV.apk"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove Android signing material
        if: always()
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: rm -f "${KEYSTORE_PATH:-}"

  ios:
    name: iOS signed IPA
    needs: metadata
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Verify XcodeGen project consistency
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}.zip"
          install_dir="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${archive}"
          printf '%s  %s\n' "${XCODEGEN_SHA256}" "${archive}" | shasum -a 256 --check
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          "${install_dir}/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- Auralis.xcodeproj/project.pbxproj

      - name: Run Swift package tests
        run: swift test --jobs 1 --package-path Packages/AuralisCore

      - name: Import iOS signing certificate and profiles
        id: signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_IOS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROFILE_BASE64 }}
          APPLE_IOS_INTENTS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_INTENTS_PROFILE_BASE64 }}
          APPLE_IOS_LIVE_ACTIVITY_PROFILE_BASE64: ${{ secrets.APPLE_IOS_LIVE_ACTIVITY_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            APPLE_IOS_CERTIFICATE_BASE64 \
            APPLE_IOS_CERTIFICATE_PASSWORD \
            APPLE_IOS_PROFILE_BASE64 \
            APPLE_IOS_INTENTS_PROFILE_BASE64 \
            APPLE_IOS_LIVE_ACTIVITY_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}" >&2
              exit 1
            fi
          done

          keychain_path="${RUNNER_TEMP}/auralis-ios-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::${keychain_password}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          certificate_path="${RUNNER_TEMP}/auralis-ios-distribution.p12"
          printf '%s' "${APPLE_IOS_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security import "${certificate_path}" \
            -P "${APPLE_IOS_CERTIFICATE_PASSWORD}" \
            -k "${keychain_path}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"

          profile_dir="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${profile_dir}"
          install_profile() {
            local label="$1"
            local encoded="$2"
            local profile_path="${RUNNER_TEMP}/${label}.mobileprovision"
            local plist_path="${profile_path}.plist"
            printf '%s' "${encoded}" | base64 -D > "${profile_path}"
            security cms -D -i "${profile_path}" -o "${plist_path}"
            local uuid
            local profile_name
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${plist_path}")"
            profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${plist_path}")"
            cp "${profile_path}" "${profile_dir}/${uuid}.mobileprovision"
            printf '%s\n' "${profile_name}"
          }

          ios_profile_name="$(install_profile ios "${APPLE_IOS_PROFILE_BASE64}")"
          intents_profile_name="$(install_profile intents "${APPLE_IOS_INTENTS_PROFILE_BASE64}")"
          live_activity_profile_name="$(install_profile live-activity "${APPLE_IOS_LIVE_ACTIVITY_PROFILE_BASE64}")"
          {
            echo "keychain_path=${keychain_path}"
            echo "ios_profile_name=${ios_profile_name}"
            echo "intents_profile_name=${intents_profile_name}"
            echo "live_activity_profile_name=${live_activity_profile_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Archive unsigned iOS app for export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcode_team_setting="$(printf 'DEVELOPMENT_%s' TEAM)=${APPLE_TEAM_ID}"
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/Auralis-iOS.xcarchive" \
            -derivedDataPath "${RUNNER_TEMP}/Auralis-iOS-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            "${xcode_team_setting}" \
            MARKETING_VERSION="${VERSION_NAME}" \
            CURRENT_PROJECT_VERSION="${VERSION_CODE}" \
            archive

      - name: Export signed iOS IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ steps.signing.outputs.ios_profile_name }}
          INTENTS_PROFILE_NAME: ${{ steps.signing.outputs.intents_profile_name }}
          LIVE_ACTIVITY_PROFILE_NAME: ${{ steps.signing.outputs.live_activity_profile_name }}
          IOS_EXPORT_METHOD: ${{ needs.metadata.outputs.ios_export_method }}
        shell: bash
        run: |
          set -euo pipefail
          export_options="${RUNNER_TEMP}/Auralis-iOS-ExportOptions.plist"
          python3 - "${export_options}" <<'PY'
          import pathlib
          import plistlib
          import sys
          import os

          output = pathlib.Path(sys.argv[1])
          payload = {
              "destination": "export",
              "method": os.environ["IOS_EXPORT_METHOD"],
              "provisioningProfiles": {
                  "com.auralis.player.ios": os.environ["IOS_PROFILE_NAME"],
                  "com.auralis.player.ios.AuralisIntents": os.environ["INTENTS_PROFILE_NAME"],
                  "com.auralis.player.ios.AuralisLiveActivity": os.environ["LIVE_ACTIVITY_PROFILE_NAME"],
              },
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "teamID": os.environ["APPLE_TEAM_ID"],
              "thinning": "<none>",
          }
          with output.open("wb") as stream:
              plistlib.dump(payload, stream, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

          export_dir="${RUNNER_TEMP}/Auralis-iOS-export"
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/Auralis-iOS.xcarchive" \
            -exportOptionsPlist "${export_options}" \
            -exportPath "${export_dir}"

          ipa="$(find "${export_dir}" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -s "${ipa}" ]] || { echo "::error::xcodebuild did not produce an IPA" >&2; exit 1; }
          inspect_dir="${RUNNER_TEMP}/Auralis-iOS-ipa-inspect"
          mkdir -p "${inspect_dir}"
          unzip -q "${ipa}" -d "${inspect_dir}"
          codesign --verify --deep --strict --verbose=2 "${inspect_dir}/Payload/Auralis.app"

          mkdir -p release-assets
          cp "${ipa}" "release-assets/Auralis-${RELEASE_TAG}-iOS.ipa"

      - name: Upload iOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove iOS signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/auralis-ios-distribution.p12"

  macos:
    name: Signed and notarized macOS DMG
    needs: metadata
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Verify XcodeGen project consistency
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}.zip"
          install_dir="${RUNNER_TEMP}/xcodegen-${XCODEGEN_VERSION}"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${archive}"
          printf '%s  %s\n' "${XCODEGEN_SHA256}" "${archive}" | shasum -a 256 --check
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          "${install_dir}/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- Auralis.xcodeproj/project.pbxproj

      - name: Import Developer ID certificate
        id: signing
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 \
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            DEVELOPER_ID_APPLICATION \
            APPLE_TEAM_ID \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: ${name}" >&2
              exit 1
            fi
          done

          keychain_path="${RUNNER_TEMP}/auralis-macos-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::${keychain_password}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          certificate_path="${RUNNER_TEMP}/auralis-developer-id.p12"
          printf '%s' "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security import "${certificate_path}" \
            -P "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -k "${keychain_path}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"

          notary_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | base64 -D > "${notary_key_path}"
          chmod 600 "${notary_key_path}"
          {
            echo "keychain_path=${keychain_path}"
            echo "notary_key_path=${notary_key_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Archive signed macOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          xcode_team_setting="$(printf 'DEVELOPMENT_%s' TEAM)=${APPLE_TEAM_ID}"
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme AuralisMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${RUNNER_TEMP}/Auralis-macOS.xcarchive" \
            -derivedDataPath "${RUNNER_TEMP}/Auralis-macOS-DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${DEVELOPER_ID_APPLICATION}" \
            "${xcode_team_setting}" \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="${VERSION_NAME}" \
            CURRENT_PROJECT_VERSION="${VERSION_CODE}" \
            archive

      - name: Create, notarize, and verify macOS DMG
        id: package
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key_path }}
        shell: bash
        run: |
          set -euo pipefail
          app_path="${RUNNER_TEMP}/Auralis-macOS.xcarchive/Products/Applications/Auralis.app"
          [[ -d "${app_path}" ]] || { echo "::error::macOS archive did not contain Auralis.app" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${app_path}"

          staging_dir="${RUNNER_TEMP}/Auralis-dmg-staging"
          mkdir -p "${staging_dir}"
          ditto "${app_path}" "${staging_dir}/Auralis.app"
          ln -s /Applications "${staging_dir}/Applications"

          dmg_path="${RUNNER_TEMP}/Auralis-${RELEASE_TAG}-macOS.dmg"
          hdiutil create \
            -volname "Auralis ${VERSION_NAME}" \
            -srcfolder "${staging_dir}" \
            -ov \
            -format UDZO \
            "${dmg_path}"
          codesign --force --sign "${DEVELOPER_ID_APPLICATION}" --timestamp "${dmg_path}"

          xcrun notarytool submit "${dmg_path}" \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          spctl --assess --type open --verbose=4 "${dmg_path}"

          mkdir -p release-assets
          cp "${dmg_path}" "release-assets/Auralis-${RELEASE_TAG}-macOS.dmg"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove macOS signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key_path }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true
          rm -f "${NOTARY_KEY_PATH:-}" "${RUNNER_TEMP}/auralis-developer-id.p12"

  publish:
    name: Publish GitHub Release
    needs: [metadata, android, ios, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          (( ${#assets[@]} > 0 )) || { echo "::error::No release assets were downloaded" >&2; exit 1; }
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Auralis ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
