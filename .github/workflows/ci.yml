name: CI

on:
  # 手动触发：改动面较大时避免每次推送/PR 都自动跑，需要时在 Actions 页手动运行。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit tests + builds
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --oneline HEAD
          fi

      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          swift --version

      - name: Swift 6 tests (AuralisCore)
        run: swift test --package-path Packages/AuralisCore

      - name: Build macOS app
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme AuralisMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS app (generic)
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # AVFoundation 真实播放边界测试需要能驱动 AVPlayer 的环境，
  # 与纯单元测试分开，避免不稳定环境阻塞主 CI。
  macOS-av-integration:
    name: macOS AV integration tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AVFoundation playback integration tests
        run: |
          AURALIS_RUN_AV_TESTS=1 \
            swift test \
            --package-path Packages/AuralisCore \
            --filter AVFoundationPlaybackEngine
