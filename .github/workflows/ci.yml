# SPDX-License-Identifier: GPL-3.0-only
name: Apple CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths-ignore:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit tests + builds
    # Match the Xcode 27 toolchain used for local validation. The older
    # macos-15/Xcode 16.4 Swift frontend crashes while lowering AppShell.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --oneline HEAD
          fi

      - name: Secret scan
        run: python3 Scripts/check_secrets.py

      - name: SPDX header check
        run: python3 Scripts/check_license_headers.py

      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          swift --version

      - name: XcodeGen project consistency
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          install_dir="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 --check
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          xcodegen_bin="$install_dir/xcodegen/bin/xcodegen"
          "$xcodegen_bin" --version
          "$xcodegen_bin" generate
          if ! git diff --exit-code -- Auralis.xcodeproj/project.pbxproj >/dev/null 2>&1; then
            echo "::error::project.yml 与 Auralis.xcodeproj 不一致。请在本地运行 'xcodegen generate' 并提交生成的工程文件。"
            exit 1
          fi
          echo "XcodeGen 输出与已提交工程一致"

      - name: Localization catalog audit
        run: python3 Scripts/check_localization.py

      - name: Swift 6 tests (AuralisCore)
        run: swift test --jobs 1 --package-path Packages/AuralisCore

      - name: Build macOS app
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme AuralisMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build macOS app (Release)
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme AuralisMac \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS app (generic)
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Inspect iOS app artifact
        shell: bash
        run: |
          set -euo pipefail
          products_dir="$(xcodebuild -project Auralis.xcodeproj -scheme Auralis -configuration Debug -destination 'generic/platform=iOS' -showBuildSettings | awk -F ' = ' '$1 ~ /^[[:space:]]*TARGET_BUILD_DIR$/ { print $2; exit }')"
          if [ -z "$products_dir" ] || [ ! -d "$products_dir/Auralis.app" ]; then
            echo "::error::Debug iOS app product directory was not found"
            exit 1
          fi
          expected_commit="$(git rev-parse --short=8 HEAD)"
          bash Scripts/check_ios_artifact.sh "$products_dir/Auralis.app" "$expected_commit"

      - name: Build iOS app (Release, generic)
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS app (Simulator)
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$simulator_id" ]; then
            echo "::error::An established iPhone Simulator is required for this PR's iOS UI smoke gate."
            exit 1
          fi
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS UI smoke tests (Simulator)
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$simulator_id" ]; then
            echo "::error::An established iPhone Simulator is required for this PR's iOS UI smoke gate."
            exit 1
          fi
          ensure_simulator_ready() {
            local simulator_state
            simulator_state="$(xcrun simctl list devices | awk -v id="$simulator_id" '$0 ~ id { if ($0 ~ /Booted/) print "Booted"; else if ($0 ~ /Booting/) print "Booting"; else print "Stopped"; exit }')"
            case "$simulator_state" in
              Booted|Booting) ;;
              *) xcrun simctl boot "$simulator_id" ;;
            esac
            xcrun simctl bootstatus "$simulator_id" -b
          }
          ensure_simulator_ready
          test_log="$RUNNER_TEMP/auralis-ui-smoke.log"
          run_ui_tests() {
            local output_log="$1"
            xcodebuild \
              -project Auralis.xcodeproj \
              -scheme Auralis \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO \
              -only-testing:AuralisUITests \
              test | tee "$output_log"
          }
          if ! run_ui_tests "$test_log"; then
            if ! grep -Eq 'Timed out waiting for AX loaded notification|Failed to initialize for UI testing|Failure collecting diagnostics from simulator' "$test_log"; then
              exit 1
            fi
            echo "::warning::Simulator UI test infrastructure failed to initialize; restarting the established simulator once."
            xcrun simctl shutdown "$simulator_id" || true
            ensure_simulator_ready
            retry_log="$RUNNER_TEMP/auralis-ui-smoke-retry.log"
            run_ui_tests "$retry_log"
            test_log="$retry_log"
          fi
          if ! grep -Eq 'Executed [1-9][0-9]* tests, with 0 failures' "$test_log"; then
            echo "::error::AuralisUITests did not report an executed passing test run."
            exit 1
          fi

  macOS-av-integration:
    name: macOS AV test target compilation
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AVFoundation test target compilation
        run: |
          swift test \
            --jobs 1 \
            --package-path Packages/AuralisCore \
            --filter AVFoundationPlaybackEngine
