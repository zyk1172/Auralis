name: CI

on:
  # R08：恢复自动触发——push 到 main 与 PR 都跑，防止问题"修了又回来"。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit tests + builds
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --oneline HEAD
          fi

      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          swift --version

      # R08：XcodeGen 生成结果一致性检查——project.yml 与 .xcodeproj 不得漂移。
      - name: XcodeGen project consistency
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          install_dir="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 --check
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          xcodegen_bin="$install_dir/xcodegen/bin/xcodegen"
          "$xcodegen_bin" --version
          "$xcodegen_bin" generate
          if ! git diff --exit-code -- Auralis.xcodeproj/project.pbxproj >/dev/null 2>&1; then
            echo "::error::project.yml 与 Auralis.xcodeproj 不一致。请在本地运行 'xcodegen generate' 并提交生成的工程文件。"
            exit 1
          fi
          echo "XcodeGen 输出与已提交工程一致"

      # Catalog completeness is a blocking check. The optional --hardcoded scan
      # intentionally stays out of the gate for now: the repository contains
      # existing Siri phrases and Agent protocol text that are not UI catalog
      # entries; those findings are tracked separately instead of masking build
      # regressions behind a noisy baseline.
      - name: Localization catalog audit
        run: python3 Scripts/check_localization.py

      - name: Swift 6 tests (AuralisCore)
        run: swift test --package-path Packages/AuralisCore

      - name: Build macOS app
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme AuralisMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build macOS app (Release)
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme AuralisMac \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS app (generic)
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS app (Release, generic)
        run: |
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # R08：Auralis scheme 没有 Testables，不能把 SPM 单测伪装成 iOS UI 测试；
      # 这里仍使用真实可用的 Simulator destination 编译 app，覆盖 iOS Simulator SDK
      # 与扩展链接。若 runner 没有已安装 runtime，明确记录并跳过，不阻塞其它构建。
      - name: Build iOS app (Simulator)
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$simulator_id" ]; then
            echo "::warning::No available iPhone Simulator runtime on this runner; generic iOS build already passed."
            exit 0
          fi
          xcodebuild \
            -project Auralis.xcodeproj \
            -scheme Auralis \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            build

  # AVFoundation 真实播放边界测试需要能驱动 AVPlayer 的 run loop。
  # Swift Testing 的无界面 runner 在 GitHub macOS 环境中不会持续驱动该
  # run loop，因此这里保留测试目标的编译/跳过检查；真实音频回归仍按
  # Docs/ManualValidation.md 在本机或真机执行。
  macOS-av-integration:
    name: macOS AV integration tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AVFoundation playback test target
        run: |
          swift test \
            --package-path Packages/AuralisCore \
            --filter AVFoundationPlaybackEngine
