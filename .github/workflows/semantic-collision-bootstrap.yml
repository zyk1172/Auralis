name: Semantic collision recommendation bootstrap

on:
  push:
    branches:
      - feat/semantic-collision-recommendation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-collision-recommendation
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/semantic_collision_patch.py
      - name: Commit product changes
        run: |
          rm -f .github/semantic_collision_patch.py .github/workflows/semantic-collision-bootstrap.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(recommendation): add semantic collision grounding"
          git push origin HEAD:feat/semantic-collision-recommendation
