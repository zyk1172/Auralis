              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all_checked(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected >= {minimum} markers, found {count}: {old[:80]!r}")
