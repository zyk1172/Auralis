            candidates = listOf(SemanticRecommendationCandidate("Hello", "Lionel Richie")),
            tracks = listOf(track("1", "Hello", "Adele")),
            targetCount = 1,
        )
        assertThat(result).isEmpty()
    }

    @Test fun titleOnlyAmbiguityIsRejected() {
