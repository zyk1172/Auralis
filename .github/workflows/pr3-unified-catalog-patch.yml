name: PR3 unified catalog patch

on:
  push:
    branches:
      - feat/local-music-unified-catalog
    paths:
      - .github/workflows/pr3-unified-catalog-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-music-unified-catalog
          fetch-depth: 0
      - name: Patch unified catalog consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Packages/AuralisCore/Sources/AgentKit/AgentToolkit.swift')
          s = p.read_text()
          replacements = {
              'catalog.searchTracks(query: q, serverID: serverID)': 'catalog.unifiedSearchTracks(query: q, activeServerID: serverID)',
              'catalog.searchAlbums(query: q, serverID: serverID)': 'catalog.unifiedSearchAlbums(query: q, activeServerID: serverID)',
              'catalog.searchArtists(query: q, serverID: serverID)': 'catalog.unifiedSearchArtists(query: q, activeServerID: serverID)',
              'catalog.getFavorites(serverID: serverID)': 'catalog.unifiedFavorites(activeServerID: serverID)',
              'catalog.allTracks(serverID: serverID)': 'catalog.unifiedTracks(activeServerID: serverID)',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'AgentToolkit replacement missing: {old}')
              s = s.replace(old, new)
          old = '    /// GlobalID 必须属于当前活跃服务器：切换服务器后旧会话中的 ID 一律视为无效，\n    /// 防止用上一台服务器的 ID 操作当前服务器（这是播放/收藏/歌单 400 与串库的根因之一）。\n    private static func serverIDMatches(_ gid: GlobalID, _ serverID: ServerID?) -> Bool {\n        guard let serverID else { return true }\n        return gid.serverID == serverID\n    }'
          new = '    /// GlobalID 必须属于当前活跃服务器或真实本地音乐 namespace。\n    /// 其它已保存服务器仍 fail closed，避免切换服务器后的旧会话 ID 串库。\n    private static func serverIDMatches(_ gid: GlobalID, _ serverID: ServerID?) -> Bool {\n        if gid.serverID == LocalCatalogOverlay.localServerID { return true }\n        guard let serverID else { return true }\n        return gid.serverID == serverID\n    }'
          if old not in s:
              raise SystemExit('AgentToolkit serverIDMatches block missing')
          p.write_text(s.replace(old, new))

          p = Path('Packages/AuralisCore/Sources/AppShell/Mac/Search/MacSearchView.swift')
          s = p.read_text()
          old = 'store.searchAll(query: q, serverID: serverID)'
          new = 'store.unifiedSearchAll(query: q, activeServerID: serverID)'
          if old not in s:
              raise SystemExit('MacSearchView search call missing')
          p.write_text(s.replace(old, new))

          p = Path('android/core/data/src/main/java/com/auralis/core/data/repository/UnifiedCatalogRepository.kt')
          s = p.read_text()
          if 'import kotlinx.coroutines.flow.first\n' not in s:
              s = s.replace('import kotlinx.coroutines.flow.flowOf\n', 'import kotlinx.coroutines.flow.flowOf\nimport kotlinx.coroutines.flow.first\n')
          s = s.replace('if (serverId == localServerId)', 'if (serverId == null || serverId == localServerId)')
          s = s.replace('return if (serverId == localServerId)', 'return if (serverId == null || serverId == localServerId)')
          old = '        merge(\n            if (serverId == null || serverId == localServerId) flowOf(Unit) else delegate.homeChangeSignals(serverId),\n            local.revision.map { Unit },\n        ).distinctUntilChanged()'
          new = '        merge(\n            if (serverId == null || serverId == localServerId) flowOf(Unit) else delegate.homeChangeSignals(serverId),\n            local.revision.map { Unit },\n        )'
          if old not in s:
              raise SystemExit('UnifiedCatalogRepository home signal block missing')
          s = s.replace(old, new)
          old = '    private suspend fun <T> Flow<List<T>>.firstSnapshot(): List<T> =\n        kotlinx.coroutines.flow.first(this)'
          new = '    private suspend fun <T> Flow<List<T>>.firstSnapshot(): List<T> = first()'
          if old not in s:
              raise SystemExit('UnifiedCatalogRepository firstSnapshot block missing')
          p.write_text(s.replace(old, new))

          p = Path('android/feature/library/src/main/java/com/auralis/feature/library/LibraryScreen.kt')
          s = p.read_text()
          import_line = 'import com.auralis.core.data.graph.AuralisGraph\n'
          if 'import com.auralis.core.data.local.AndroidLocalMusicLibrary\n' not in s:
              s = s.replace(import_line, import_line + 'import com.auralis.core.data.local.AndroidLocalMusicLibrary\n')
          old = '    val serverId = rememberActiveServerId(graph)\n'
          new = old + '    val libraryServerId = serverId ?: AndroidLocalMusicLibrary.LOCAL_SERVER_ID\n'
          if old not in s:
              raise SystemExit('LibraryScreen active server declaration missing')
          s = s.replace(old, new, 1)
          marker_start = s.index('                when (scope) {')
          marker_end = s.index('                }\n            }\n        }\n    }\n}', marker_start)
          block = s[marker_start:marker_end]
          block = block.replace('serverId = serverId,', 'serverId = libraryServerId,')
          s = s[:marker_start] + block + s[marker_end:]
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/pr3-unified-catalog-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(local-music): wire unified catalog consumers"
          git push origin HEAD:feat/local-music-unified-catalog
