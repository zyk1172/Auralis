# SPDX-License-Identifier: GPL-3.0-only
name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "Scripts/check_secrets.py"
      - "Scripts/check_license_headers.py"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "Scripts/check_secrets.py"
      - "Scripts/check_license_headers.py"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Unit tests + assembleDebug (mobile & tv)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git whitespace check
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --oneline HEAD
          fi

      - name: Secret scan
        run: python3 ../Scripts/check_secrets.py

      - name: SPDX header check
        run: python3 ../Scripts/check_license_headers.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK licenses & ensure API 36 platform
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build app-mobile debug APK
        run: ./gradlew :app-mobile:assembleDebug --stacktrace

      - name: Build app-tv debug APK (Leanback)
        run: ./gradlew :app-tv:assembleDebug --stacktrace

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auralis-android-debug-apks
          path: |
            android/app-mobile/build/outputs/apk/debug/*.apk
            android/app-tv/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
