name: Auralis
options:
  bundleIdPrefix: com.auralis.player
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: "zh-Hans"
packages:
  AuralisCore:
    path: Packages/AuralisCore
targets:
  Auralis:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes:
          - Info.plist
          - Intents
          - LiveActivity
          - UITests
      - path: Apps/Shared
        excludes:
          - Resources/Localizable.xcstrings
    dependencies:
      - package: AuralisCore
        product: AppShell
      - sdk: AppIntents.framework
      - target: AuralisIntents
      - target: AuralisLiveActivity
    preBuildScripts:
      - name: Generate build provenance
        script: |
          set -eu
          # This file belongs to the application target, not the AppShell
          # package.  The app target's pre-build phase runs before its Swift
          # sources compile, whereas package products may already have been
          # built as dependencies.
          provenance_file="${SRCROOT}/Apps/iOS/BuildProvenance.generated.swift"
          commit="$(git -C "${SRCROOT}" rev-parse --short=8 HEAD 2>/dev/null || true)"
          branch="$(git -C "${SRCROOT}" symbolic-ref --quiet --short HEAD 2>/dev/null || echo detached)"
          [ -n "${commit}" ] || commit="unknown"
          configuration="${CONFIGURATION:-Unknown}"
          version="${MARKETING_VERSION:-Unknown}"
          build_number="${CURRENT_PROJECT_VERSION:-Unknown}"
          # User script sandboxing permits declared outputs and DerivedFiles;
          # do not create an undeclared sibling next to a source file.
          mkdir -p "${DERIVED_FILE_DIR}"
          tmp_file="${DERIVED_FILE_DIR}/BuildProvenance.generated.swift.tmp"
          cat > "${tmp_file}" <<EOF
          // Generated during the Auralis application build phase. Do not edit by hand.
          import AppShell

          enum BuildProvenanceGenerated {
              static let gitCommit = "${commit}"
              static let gitBranch = "${branch}"
              static let buildConfiguration = "${configuration}"
              static let appVersion = "${version}"
              static let buildNumber = "${build_number}"

              @MainActor
              static func install() {
                  BuildProvenance.install(
                      commit: gitCommit,
                      branch: gitBranch,
                      configuration: buildConfiguration,
                      version: appVersion,
                      buildNumber: buildNumber
                  )
              }
          }
          EOF
          mv "${tmp_file}" "${provenance_file}"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Apps/iOS/BuildProvenance.generated.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.player.ios
        PRODUCT_NAME: Auralis
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/iOS/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Auralis.entitlements
        # The provenance phase reads the checkout's .git metadata.  Keep the
        # rest of the project sandboxed, but explicitly opt this target's
        # declared build phase out so the source -> binary proof is reliable.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        DEVELOPMENT_TEAM: "JUQXD87P93"
        DEVELOPMENT_LANGUAGE: "zh-Hans"
  AuralisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOS/UITests
    dependencies:
      - target: Auralis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.player.ios.uitests
        PRODUCT_NAME: AuralisUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Auralis
        DEVELOPMENT_TEAM: "JUQXD87P93"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  AuralisMac:
    type: application
    platform: macOS
    productName: Auralis
    sources:
      - path: Apps/macOS
        excludes:
          - Info.plist
          - AuralisMac.entitlements
      - path: Apps/Shared
      - path: Apps/iOS/Resources
        excludes:
          - Localizable.xcstrings
    dependencies:
      - package: AuralisCore
        product: AppShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.player.macos
        PRODUCT_NAME: Auralis
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/AuralisMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "JUQXD87P93"
        ENABLE_APP_SANDBOX: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: NO
        DEVELOPMENT_LANGUAGE: "zh-Hans"
  AuralisIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/iOS/Intents
        excludes:
          - Info.plist
    dependencies:
      - package: AuralisCore
        product: LocalCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.player.ios.AuralisIntents
        ENABLE_APP_INTENTS_METADATA_EXTRACTION: NO
        PRODUCT_NAME: AuralisIntents
        INFOPLIST_FILE: Apps/iOS/Intents/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Intents/AuralisIntents.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "JUQXD87P93"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: NO
  AuralisLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/iOS/LiveActivity
        excludes:
          - Info.plist
    dependencies:
      - package: AuralisCore
        product: Domain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.player.ios.AuralisLiveActivity
        PRODUCT_NAME: AuralisLiveActivity
        INFOPLIST_FILE: Apps/iOS/LiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/LiveActivity/AuralisLiveActivity.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "JUQXD87P93"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Auralis:
    build:
      targets:
        Auralis: all
        AuralisLiveActivity: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AuralisUITests
    archive:
      config: Release
  AuralisMac:
    build:
      targets:
        AuralisMac: all
    run:
      config: Debug
    archive:
      config: Release
